name: Release package

# Publication manuelle : le paquet, l'archive source et SHA256SUMS sont
# publiés comme assets de la release GitHub (en plus de l'artifact de workflow).
# À déclencher sur un tag : le nom du tag sert de nom de release et d'asset.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build release tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            libqt6sql6-sqlite \
            libsqlite3-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-keysyms1-dev \
            libxkbcommon-x11-dev \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-templates \
            qml6-module-qtqml

      - name: Configure (Release)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DENABLE_WARNINGS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: Create source archive, package and checksums
        run: |
          set -euo pipefail
          PACKAGE="msi-cooler-manager-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          SOURCE_ARCHIVE="msi-cooler-manager-${GITHUB_REF_NAME}-src.tar.gz"
          PREFIX="msi-cooler-manager-${GITHUB_REF_NAME}/"
          STAGE="${RUNNER_TEMP}/${PACKAGE}"
          mkdir -p "${STAGE}" dist
          cmake --install build --prefix "${STAGE}/usr"
          tar -czf "dist/${PACKAGE}.tar.gz" -C "${STAGE}" .
          # Archive produite par le workflow (contenu stable), pas générée par
          # GitHub au téléchargement. Le préfixe est retiré par install.sh.
          git archive --format=tar.gz --prefix="${PREFIX}" -o "dist/${SOURCE_ARCHIVE}" "${GITHUB_REF_NAME}" \
            || git archive --format=tar.gz --prefix="${PREFIX}" -o "dist/${SOURCE_ARCHIVE}" HEAD
          (cd dist && sha256sum "${PACKAGE}.tar.gz" "${SOURCE_ARCHIVE}" > SHA256SUMS)
          (cd dist && sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256")
          cat dist/SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE="msi-cooler-manager-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
          SOURCE_ARCHIVE="msi-cooler-manager-${GITHUB_REF_NAME}-src.tar.gz"
          ASSETS=(
            "dist/${PACKAGE}.tar.gz"
            "dist/${SOURCE_ARCHIVE}"
            "dist/SHA256SUMS"
          )
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${ASSETS[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes "${ASSETS[@]}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-cooler-manager-package
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
